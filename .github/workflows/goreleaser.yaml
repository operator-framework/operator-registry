name: goreleaser
on:
  push:
    branches:
      - 'master'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request: {}
  merge_group:
defaults:
  run:
    shell: bash
jobs:
  release:
    permissions:
      contents: write
    needs:
      - build-windows
      - build-darwin
      - build-linux

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8

      - run: |
         for dist in dist-*; do
           tar -C "${dist}" -xf "${dist}/${dist}.tar"
         done

      - name: Create assets
        run: |
          set -xe
          mkdir -p assets
          cat dist-*/dist/checksums.txt > assets/checksums.txt
          for asset in dist-*/dist/*_*/*; do
            base=$(basename "${asset}")
            variant=$(basename $(dirname "${asset}") | cut -d_ -f1)
            cp "${asset}" "assets/${variant}-${base}"
          done
          find assets -ls
          cat assets/checksums.txt

      - name: Upload Release Assets
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            notes_file=$(mktemp)
            trap 'rm -f "${notes_file}"' EXIT
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${RELEASE_TAG}" \
              -f target_commitish="${GITHUB_SHA}" > "${notes_file}"
            gh release edit "${RELEASE_TAG}" \
              --title "$(jq -r '.name' "${notes_file}")" \
              --notes "$(jq -r '.body' "${notes_file}")"
            gh release upload "${RELEASE_TAG}" --clobber ./assets/*
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --generate-notes \
              ./assets/* || {
                # A GUI-created release may race this tag-triggered run.
                gh release upload "${RELEASE_TAG}" --clobber ./assets/*
            }
          fi

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser requires fetch-depth: 0 to correctly
          # run git describe
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: "Run GoReleaser"
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ARGS: release --verbose --skip=validate --clean -f release/goreleaser.windows.yaml ${{ github.event_name == 'pull_request' && '--snapshot' || '' }}

      - run: tar -cvf dist-windows.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist-windows.tar

  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser requires fetch-depth: 0 to correctly
          # run git describe
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: "Run GoReleaser"
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ARGS: release --verbose --clean -f release/goreleaser.darwin.yaml --skip=validate ${{ github.event_name == 'pull_request' && '--snapshot' || '' }}

      - run: gtar -cvf dist-darwin.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-darwin
          path: dist-darwin.tar

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser requires fetch-depth: 0 to correctly
          # run git describe
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: "Install linux cross-compilers"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-s390x-linux-gnu gcc-powerpc64le-linux-gnu

      - name: "Set the image tag"
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            # Release tags.
            echo IMAGE_TAG="${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          elif [[ $GITHUB_REF == refs/heads/* ]]; then
            # Branch build.
            echo IMAGE_TAG="$(echo "${GITHUB_REF#refs/heads/}" | sed -r 's|/+|-|g')" >> $GITHUB_ENV
          elif [[ $GITHUB_REF == refs/pull/* ]]; then
            # PR build.
            echo IMAGE_TAG="pr-$(echo "${GITHUB_REF}" | sed -E 's|refs/pull/([^/]+)/?.*|\1|')" >> $GITHUB_ENV
          else
            echo IMAGE_TAG="$(git describe --tags --always)" >> $GITHUB_ENV
          fi

      - name: "Login to Quay"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: "Run GoReleaser"
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ARGS: release --verbose --clean -f release/goreleaser.linux.yaml --skip=validate ${{ github.event_name == 'pull_request' && '--snapshot' || '' }}

      - run: tar -cvf dist-linux.tar dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist-linux.tar
